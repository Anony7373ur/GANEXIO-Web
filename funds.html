<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dana Desa Bersama - Ganexio - Desa Sipagabu</title>
<!-- TODO-ISI: ubah deskripsi singkat ini untuk mesin pencari (SEO) -->
<meta name="description" content="Keuangan Desa Sipagabu yang transparan">
<meta name="theme-color" content="#14213d">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container" id="main">
  <div id="pagehead"></div>
  <div class="row between card" style="margin-bottom:1.2rem;padding:.9rem 1.2rem" id="roleBar"></div>
  <div class="kpi" id="kpi"></div>
  <div class="split" style="margin-bottom:1.3rem">
    <section class="card"><h2>Pemasukan dan pengeluaran 6 bulan</h2><div id="chart"></div><div class="row muted"><span><b style="color:var(--green)">&#9632;</b> Masuk</span><span><b style="color:var(--red)">&#9632;</b> Keluar</span></div></section>
    <section class="card"><h2>Anggaran dan realisasi</h2><div class="stack" id="budget"></div></section>
  </div>
  <section id="tpanel" hidden class="card" style="margin-bottom:1.3rem">
    <h2>Panel Bendahara</h2>
    <div class="tabs" id="ttabs"><button class="tab on" data-t="rec" type="button"><i data-ic="plus"></i>Catat transaksi</button><button class="tab" data-t="levy" type="button"><i data-ic="users"></i>Iuran dan pendapatan</button><button class="tab" data-t="tech" type="button"><i data-ic="server"></i>Biaya teknologi dan upah</button><button class="tab" data-t="bud" type="button"><i data-ic="list"></i>Atur anggaran</button></div>
    <div id="t-rec"><form id="f" class="cols" style="grid-template-columns:1fr 1fr"><div><div class="msg-err" role="alert"></div>
      <div class="choices inline"><label class="choice"><input type="radio" name="type" value="masuk" checked><span><i data-ic="up"></i>Uang masuk</span></label><label class="choice"><input type="radio" name="type" value="keluar"><span><i data-ic="down"></i>Uang keluar</span></label></div>
      <div class="field"><label for="amt">Jumlah (Rupiah)</label><input id="amt" name="amount" type="number" min="1" inputmode="numeric" required></div>
      <div class="field"><label for="dt">Tanggal</label><input id="dt" name="date" type="date" required></div></div>
      <div><div class="field"><label for="kind">Jenis</label><select id="kind" name="kind"></select></div><div class="field"><label for="cat">Kelompok</label><select id="cat" name="category"></select></div>
      <div class="field"><label for="desc">Keterangan</label><input id="desc" name="description" maxlength="120" required></div><button class="btn btn-primary btn-block" type="submit"><i data-ic="check"></i>Simpan Catatan</button></div></form></div>
    <div id="t-levy" hidden></div><div id="t-tech" hidden></div><div id="t-bud" hidden></div>
  </section>
  <section class="card"><div class="row between"><h2 style="margin:0">Riwayat kas (hanya baca untuk warga)</h2><div class="row no-print"><button class="btn btn-ghost btn-sm" id="csvBtn" type="button"><i data-ic="download"></i>CSV</button><button class="btn btn-ghost btn-sm" id="prBtn" type="button"><i data-ic="print"></i>Cetak</button></div></div>
    <div class="toolbar no-print" style="margin:.8rem 0"><input id="q" placeholder="Cari keterangan" aria-label="Cari"><select id="ft" aria-label="Filter"><option value="">Semua</option><option value="masuk">Pemasukan</option><option value="keluar">Pengeluaran</option><option value="penjualan">Penjualan</option><option value="pembelian">Pembelian</option><option value="iuran">Iuran</option><option value="operasional">Teknologi dan operasional</option><option value="upah">Upah</option></select></div>
    <div class="table-wrap" id="list"></div></section>
</main>
<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/funds.js"></script>
</body>
</html>
