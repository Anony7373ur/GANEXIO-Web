<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pasokan dari Kota - Ganexio.id</title>
<!-- TODO-ISI: ubah deskripsi singkat ini untuk mesin pencari (SEO) -->
<meta name="description" content="Minta pasokan pangan, sumber daya alam, dan bahan bangunan dari kota">
<meta name="theme-color" content="#14213d">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container" id="main">
  <div id="pagehead"></div>
  <div class="tabs" id="tabs"><button class="tab on" data-tab="new" type="button"><i data-ic="plus"></i>Buat Permintaan</button><button class="tab" data-tab="track" type="button"><i data-ic="search"></i>Lacak Permintaan</button></div>
  <section id="new" class="cols">
    <form class="card" id="f">
      <h2>Permintaan baru</h2>
      <div class="msg-err" role="alert"></div>
      <label class="lbl">1. Jenis kebutuhan</label>
      <div class="choices" id="cats">
        <label class="choice"><input type="radio" name="category" value="pangan" checked><span><i data-ic="basket"></i><b>Bahan Pangan<small>Beras, minyak, gula, obat dasar</small></b></span></label>
        <label class="choice"><input type="radio" name="category" value="sumber_daya"><span><i data-ic="leaf"></i><b>Sumber Daya Alam<small>Bibit, pupuk, bahan bakar, air</small></b></span></label>
        <label class="choice"><input type="radio" name="category" value="bahan_bangunan"><span><i data-ic="brick"></i><b>Bahan Bangunan<small>Semen, seng, kayu, paku</small></b></span></label>
      </div>
      <label class="lbl">2. Pilih barang (atau ketik sendiri)</label>
      <div class="chips" id="quick" style="margin-bottom:.8rem"></div>
      <div class="stack" id="items" style="margin-bottom:.8rem"></div>
      <button class="btn btn-ghost btn-sm" id="addItem" type="button"><i data-ic="plus"></i>Tambah barang lain</button>
      <hr style="border:0;border-top:1px solid var(--line);margin:1.1rem 0">
      <div class="two">
        <div class="field"><label for="hamlet">Diantar ke</label><select id="hamlet" name="hamlet"></select></div>
        <div class="field"><label for="urg">Seberapa mendesak?</label><select id="urg" name="urgency"><option value="biasa">Biasa</option><option value="mendesak">Mendesak</option></select></div>
      </div>
      <div class="field"><label for="note">Catatan (boleh kosong)</label><textarea id="note" name="note"></textarea></div>
      <button class="btn btn-primary btn-block" type="submit"><i data-ic="send"></i>Kirim Permintaan</button>
    </form>
    <aside class="stack">
      <div class="card"><h2>Alur pasokan</h2><div id="flowDemo"></div><p class="muted" style="margin-top:.8rem">Perangkat desa memproses permintaan, memesan ke pemasok kota, lalu barang dikirim ke dusun Anda.</p></div>
      <div class="kpi" id="kpi" style="grid-template-columns:1fr 1fr;margin:0"></div>
    </aside>
  </section>
  <section id="track" hidden>
    <div class="toolbar"><input id="q" placeholder="Cari kode tiket atau nama barang" aria-label="Cari"><select id="fs" aria-label="Filter status"><option value="">Semua status</option><option>menunggu</option><option>diproses</option><option>dikirim</option><option>selesai</option><option>ditolak</option></select></div>
    <div class="stack" id="list"></div>
  </section>
</main>
<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/diagram.js"></script>
<script src="js/supplies.js"></script>
</body>
</html>
