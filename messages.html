<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pesan dan Permohonan - Ganexio.id</title>
<!-- TODO-ISI: ubah deskripsi singkat ini untuk mesin pencari (SEO) -->
<meta name="description" content="Kirim pesan, ajukan surat, dan laporkan masalah">
<meta name="theme-color" content="#14213d">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container" id="main">
  <div id="pagehead"></div>
  <div class="tabs"><button class="tab on" data-tab="form" type="button"><i data-ic="mail"></i>Kirim Layanan</button><button class="tab" data-tab="track" type="button"><i data-ic="search"></i>Lacak Tiket</button><button class="tab" data-tab="inbox" type="button" id="inboxTab" hidden><i data-ic="shield"></i>Kotak Masuk Petugas</button></div>
  <section id="form" class="cols">
    <form class="card" id="f"><h2>Formulir layanan</h2><div class="msg-err" role="alert"></div>
      <label class="lbl">Jenis layanan</label>
      <div class="choices" id="types">
        <label class="choice"><input type="radio" name="type" value="pesan" checked><span><i data-ic="mail"></i><b>Pesan<small>Pertanyaan atau saran</small></b></span></label>
        <label class="choice"><input type="radio" name="type" value="surat"><span><i data-ic="file"></i><b>Permohonan Surat<small>Domisili, usaha, keterangan lain</small></b></span></label>
        <label class="choice"><input type="radio" name="type" value="laporan"><span><i data-ic="flag"></i><b>Laporan / Pengaduan<small>Jalan rusak, listrik, jaringan</small></b></span></label>
      </div>
      <div class="field" id="targetF"><label for="target">Ditujukan kepada</label><select id="target" name="target"><option value="admin">Admin / Perangkat Desa</option><option value="developer">Tim Developer (website dan WiFi)</option></select></div>
      <div class="field" id="kindF" hidden><label for="kind" id="kindL">Jenis</label><select id="kind" name="kind"></select></div>
      <div class="field" id="hamF" hidden><label for="ham">Dusun</label><select id="ham" name="dusun"></select></div>
      <div class="two"><div class="field"><label for="nm">Nama</label><input id="nm" name="name" required maxlength="60"></div><div class="field"><label for="ph">Nomor HP / WhatsApp</label><input id="ph" name="phone" inputmode="tel"></div></div>
      <div class="field"><label for="sj">Judul</label><input id="sj" name="subject" maxlength="120" required></div>
      <div class="field"><label for="bd">Isi</label><textarea id="bd" name="body" maxlength="2000" required></textarea></div>
      <!-- TODO-ISI: unggah foto bukti memerlukan server. Saat ini hanya nama berkas yang dicatat. -->
      <div class="field"><label for="fl">Foto pendukung (opsional)</label><input id="fl" name="file" type="file" accept="image/*"></div>
      <button class="btn btn-primary btn-block" type="submit"><i data-ic="send"></i>Kirim</button></form>
    <aside class="stack"><div class="card"><h2>Tiket terakhir di perangkat ini</h2><div class="stack" id="mine"></div></div></aside>
  </section>
  <section id="track" hidden class="stack"><form class="card row" id="tf" style="flex-wrap:nowrap"><input id="tc" placeholder="Masukkan kode tiket, contoh: TKT-2610-0001" aria-label="Kode tiket"><button class="btn btn-primary" type="submit"><i data-ic="search"></i>Cari</button></form><div id="tres"></div></section>
  <section id="inbox" hidden class="stack"></section>
</main>
<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script src="js/diagram.js"></script>
<script src="js/messages.js"></script>
</body>
</html>
